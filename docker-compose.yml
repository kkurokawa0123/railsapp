services:
  back:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env.local
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails s -b '0.0.0.0'"
    volumes:
      - ./backend:/todoapp
    ports:
      - "3000:3000"
    depends_on:
      - db
    tty: true
    stdin_open: true

  front:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: "npm run dev"
    ports:
      - "8000:8000"
    volumes:
      - ./frontend:/todoapp
      - node_modules:/todoapp/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - back

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    # healthcheck:

  playwright:
    build:
      context: ./e2e
      dockerfile: Dockerfile
    working_dir: /e2e
    volumes:
      - ./e2e/tests:/e2e/tests
      - ./e2e/playwright.config.ts:/e2e/playwright.config.ts
      - ./e2e/test-results:/e2e/test-results
      - ./e2e/playwright-report:/e2e/playwright-report
      # - playwright_node_modules:/e2e/node_modules
    environment:
      BASE_URL: http://front:8000
    depends_on:
      - front
      - back
    profiles:
      - e2e

volumes:
  mysql_data:
  node_modules:
  # playwright_node_modules:
