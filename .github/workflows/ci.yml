name: Frontend CI

on:
  pull_request:
    branches: [main, develop, develop-dummy]
    paths:
      - "frontend/**"
      - ".github/workflows/ci.yml"

  push:
    branches: [main, develop, develop-dummy]
    paths:
      - "frontend/**"
      - ".github/workflows/ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: ソースコードを取得
        uses: actions/checkout@v7

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 依存関係をインストール
        run: npm ci

      - name: TypeScriptの型チェック
        run: npm run typecheck

      - name: Vitestの実行
        run: npm run test:run

      - name: ビルド
        run: npm run build
