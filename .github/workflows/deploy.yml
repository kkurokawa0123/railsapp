name: Frontend Deploy

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: ソースコードを取得
        uses: actions/checkout@v6

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 依存関係をインストール
        run: npm ci

      - name: ビルド
        run: npm run build
        env:
          VITE_API_URL: https://todo-sasuke-webservice.onrender.com/api/v1
          VITE_BASE_PATH: /railsapp/

      - name: SPA用404ページを作成
        run: cp dist/index.html dist/404.html

      - name: GitHub Pagesをセットアップ
        uses: actions/configure-pages@v6

      - name: ビルド成果物をアップロード
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./frontend/dist

      - name: GitHub Pagesへデプロイ
        id: deployment
        uses: actions/deploy-pages@v5
